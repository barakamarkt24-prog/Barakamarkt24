[build]
  publish = "dist"
  command = "npm run build"

# Netlify API Proxy to Cloud Run Server (Server-to-Server reverse proxy)
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-kien7lgdakhttc26u5uzal-508123128076.europe-west2.run.app/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
