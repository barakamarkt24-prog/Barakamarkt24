<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Central BM Emblem -->
  <g transform="translate(100, 20)">
    <!-- B Letter -->
    <path d="M 10 10 H 50 C 65 10 70 25 60 36 C 72 48 68 82 48 82 H 10 V 10 Z M 26 25 V 39 H 45 C 50 39 52 25 45 25 H 26 Z M 26 51 V 67 H 48 C 54 67 55 51 48 51 H 26 Z" fill="#005A36" />
    <!-- M Letter -->
    <path d="M 64 10 H 81 L 95 45 L 107 10 H 124 V 82 H 109 V 38 L 98 65 H 92 L 81 38 V 82 H 64 V 10 Z" fill="#3B8EAA" />
    <!-- White Shopping Bag with Cyan Border -->
    <g transform="translate(38, 18)">
      <path d="M 16 12 C 16 1 34 1 34 12" stroke="#3B8EAA" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <polygon points="5,12 45,12 50,60 0,60" fill="#FFFFFF" stroke="#3B8EAA" stroke-width="3.5" stroke-linejoin="round" />
      <!-- Leaf -->
      <path d="M 10 50 C 10 50 10 31 35 21 C 35 21 38 40 20 50 C 15 52 10 50 10 50 Z" fill="url(#leafGradFull)" />
      <path d="M 14 47 Q 23 36 33 26" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>

  <!-- Text: BARAKAMARKT24 -->
  <text x="200" y="155" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="3">
    <tspan fill="#005A36">BARAKA</tspan><tspan fill="#3B8EAA">MARKT24</tspan>
  </text>

  <!-- Subtitle: Arabic & International Products • Greifswald -->
  <text x="200" y="185" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="12" fill="#475569" letter-spacing="1">
    Arabic &amp; International Products • Greifswald
  </text>
</svg>
